# CTEC Consults, static site served by nginx.
# Install as /etc/nginx/sites-available/ctec-consults and symlink into sites-enabled.
#
# Nothing here is a default_server, so this file cannot capture traffic meant for
# any other site on the box. The preview block listens on its own port, and the
# domain block only answers to the name you put in it.
#
# Note on the repeated add_header lines: nginx drops every inherited add_header
# as soon as a location sets one of its own, so the security headers have to be
# restated in each location that adds a Cache-Control.

server {
    listen 8088;
    listen [::]:8088;
    server_name _;

    root /var/www/ctec-consults;
    index index.html;

    access_log /var/log/nginx/ctec-consults.access.log;
    error_log  /var/log/nginx/ctec-consults.error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    client_max_body_size 1m;

    # client side routing: any unknown path is handed to the app
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # the shell itself must never be cached or a deploy looks like it did nothing
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }

    # build output carries a content hash in the filename, so it can be cached hard
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /video/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location /img/ {
        access_log off;
        add_header Cache-Control "public, max-age=2592000" always;
        add_header X-Content-Type-Options nosniff always;
    }
}

