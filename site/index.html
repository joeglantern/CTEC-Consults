    <style>
      /* boot screen, inline so it needs no stylesheet to paint */
      #boot {
        position: fixed; inset: 0; z-index: 2000; background: #0c0d0b;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px;
        transition: opacity 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      }
      #boot.is-out { opacity: 0; pointer-events: none; }
      #boot-mark { width: 64px; height: 64px; fill: #f1ece2; animation: boot-breathe 2.4s ease-in-out infinite; }
      #boot.is-out #boot-mark { animation: none; }
      #boot-track { width: 132px; height: 1px; background: rgba(241, 236, 226, 0.16); overflow: hidden; }
      #boot-bar {
        display: block; width: 100%; height: 100%; background: #e0a030;
        transform: scaleX(0); transform-origin: left center;
        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes boot-breathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) {
        #boot-mark { animation: none; opacity: 1; }
        #boot, #boot-bar { transition: none; }
      }
    </style>
    <noscript><style>#boot { display: none; }</style></noscript>

    <!--
      Boot screen. Inline on purpose: it paints on the first frame, before the app
      bundle has even downloaded, which is the one gap an in-app loader cannot cover.
      It tracks real readiness (fonts, the mark, the first hero frame) and hands over
      to the motion intro only once the site can actually be shown.
    -->
    <div id="boot">

        <path d="M 1029.72 615.445 L 1046.9 614.906 L 1046.69 801.964 C 924.676 810.112 845.425 894.13 837.831 1014.97 L 668.654 1014.95 L 648.839 1014.9 C 648.46 923.324 688.36 824.431 748.533 755.946 C 822.239 672.056 918.307 623.036 1029.72 615.445 z"/>

        <path d="M 1057.18 614.574 C 1082.03 615.051 1103.01 616.622 1127.6 621.559 C 1215.06 638.712 1294.39 684.289 1353.26 751.199 C 1369.39 769.642 1380.18 785.281 1393.69 805.557 L 1331.51 848.151 C 1302.26 867.612 1270.2 891.757 1240.58 909.71 C 1196.54 842.114 1137.84 807.434 1057.28 801.994 L 1057.18 614.574 z"/>
      </svg>
      <div id="boot-track"><i id="boot-bar"></i></div>
    </div>
    <div id="root"></div>
    <script>
      (function () {
        var el = document.getElementById("boot");
        var bar = document.getElementById("boot-bar");
        if (!el || !bar) return;
        var p = 0, finished = null;
        function set(v) {
          if (finished || v <= p) return;
          p = v > 1 ? 1 : v;
          bar.style.transform = "scaleX(" + p + ")";
        }
        function finish() {
          // repeat calls get the same promise, so nothing starts before the screen is gone
          if (finished) return finished;
          set(1);
          finished = new Promise(function (done) {
            // let the bar reach full before anything moves, then lift the screen
            setTimeout(function () {
              el.classList.add("is-out");
              setTimeout(function () {
                el.parentNode && el.parentNode.removeChild(el);
                done();
              }, 520);
            }, 180);
          });
          return finished;
        }
        set(0.08);
        window.addEventListener("DOMContentLoaded", function () { set(0.2); });
        // pull the intro's clip now, alongside the bundle, so it is in cache by the
        // time the animation wants it rather than starting to download then
        try { fetch("/video/cgi-ink-loader.mp4").catch(function () {}); } catch (e) {}
        var api = { set: set, finish: function () { clearTimeout(guard); return finish(); } };
        // Last resort only. This screen now waits for the app bundle and nothing else,
        // and the app lifts it the moment the intro is on screen. If the bundle has not
        // arrived by now the page is broken, so show whatever there is rather than a
        // spinner that never ends.
        var guard = setTimeout(finish, 20000);
        window.__boot = api;
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
